[project]
name = "bifrost-guard"
version = "0.1.0"
description = "A law, an enforcer and a court for code reviews done by AI agents or people."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "mcp>=1.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bifrost-guard = "bifrost_guard.cli:main"
bifrost-guard-mcp = "bifrost_guard.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bifrost_guard = ["LAW.md"]
